{% extends "base.html" %}

{% block analytics %}
  {{ super() }}
  {% if config.extra.goatcounter_code %}
    <script data-goatcounter="https://{{ config.extra.goatcounter_code }}.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  {% endif %}
{% endblock %}

{% block extrahead %}
  {% if config.extra.google_site_verification %}
    <meta name="google-site-verification" content="{{ config.extra.google_site_verification }}">
  {% endif %}
  <script src="{{ 'assets/javascripts/aim-theme.js' | url }}"></script>
{% endblock %}
