# Installs the site's local Markdown extensions, extensions/aim_*.py, so Zensical can
# import them. requirements.txt pulls this in with "-e .".
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aim-wiki-extensions"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["markdown", "pyyaml>=6"]

[tool.setuptools]
package-dir = { "" = "extensions" }
py-modules = ["aim_references", "aim_related"]
